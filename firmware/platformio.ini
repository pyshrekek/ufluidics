; ufluidics - ESP32-S3 firmware
;
; Bench target is a DevKitC-1. Production target is a bare
; ESP32-S3-WROOM-1-N16: 16 MB flash, NO PSRAM. The R8 variant would consume
; GPIO33-37, which this pin map uses for STEP. See ../HARDWARE.md.

[platformio]
default_envs = esp32s3

[env:esp32s3]
; Pinned deliberately. arduino-esp32 3.x renamed the entire hardware timer API
; (timerBegin/timerAlarm), and the ESP32-S3 stepper backend story changed with
; IDF 5.3. An unpinned platform is how a working build breaks on another
; machine. src/motion.cpp compiles on both 2.x and 3.x; the pin is so that
; *which* one you get is a decision rather than an accident.
platform  = espressif32@6.13.0   ; -> arduino-esp32 2.0.17
board     = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode  = qio
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv

monitor_speed   = 115200
monitor_filters = time, esp32_exception_decoder

build_flags =
	-Wall
	-Wextra
	; Console and flashing go over native USB, which is what deletes the
	; USB-serial chip from the BOM.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=0

lib_deps =
	teemuatlut/TMCStepper@^0.7.3
